name: fetch-ucl-nba-data
# Manual run. GitHub runners have open internet (the cloud sandbox does not).
# Downloads ClubElo / extra leagues / ESPN NBA games, calibrates the UCL Elo->goals
# model, runs the NBA backtest, and pushes ONLY data files to branch `data/ucl-nba-snapshot`.
on:
  workflow_dispatch:
    inputs:
      nba_start:
        description: "NBA fetch start date (YYYY-MM-DD)"
        default: "2025-10-21"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/ucl-nba-data-layer }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy scikit-learn pytest
      - name: Fetch
        run: |
          python3 scripts/fetch_europe_data.py clubelo
          python3 scripts/fetch_europe_data.py extra-leagues
          python3 scripts/fetch_club_results.py
          python3 scripts/fetch_europe_data.py nba "${{ inputs.nba_start }}" "$(date -u +%F)"
      - name: Calibrate + backtest
        run: |
          cd scripts
          python3 calibrate_ucl.py | tee ../data/soccer/calibration_log.txt
          python3 nba_stack.py | tee ../data/nba_backtest_log.txt
          python3 -m pytest test_europe_ucl_nba.py -q -p no:cacheprovider | tail -3
      - name: Push data snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B data/ucl-nba-snapshot
          git add -f data/soccer/clubelo.csv data/soccer/extra_league_results.csv data/soccer/club_results.csv \
            data/soccer/ucl_elo_goal_model.json data/soccer/calibration_log.txt data/nba_games_2526.csv data/nba_backtest_log.txt || true
          git commit -m "data: UCL/NBA snapshot $(date -u +%F)" || echo "nothing to commit"
          git push -f origin data/ucl-nba-snapshot
